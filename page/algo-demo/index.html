<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>算法演示</title>
  <style>
    :root {
      --bg: #1e1e2e;
      --panel: #2a2b3d;
      --panel-2: #313347;
      --text: #e4e4ef;
      --muted: #9ea0b8;
      --accent: #7aa2f7;
      --accent-2: #bb9af7;
      --ok: #9ece6a;
      --err: #f7768e;
      --border: #3b3d52;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Hiragino Sans GB", "Microsoft YaHei", Helvetica, Arial, sans-serif;
      line-height: 1.6;
    }
    .container {
      max-width: 860px;
      margin: 0 auto;
      padding: 32px 20px 64px;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 24px;
    }
    header h1 {
      margin: 0;
      font-size: 1.6rem;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .tabs {
      display: flex;
      gap: 8px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
    .tab-head {
      padding: 10px 18px;
      cursor: pointer;
      border: 1px solid transparent;
      border-bottom: none;
      border-radius: 8px 8px 0 0;
      color: var(--muted);
      background: transparent;
      font-size: 0.95rem;
      transition: all 0.15s ease;
      user-select: none;
    }
    .tab-head:hover { color: var(--text); background: var(--panel); }
    .tab-head.active {
      color: var(--text);
      background: var(--panel);
      border-color: var(--border);
    }
    .tab-panel { display: none; }
    .tab-panel.active { display: block; }
    .panel-card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 0 8px 8px 8px;
      padding: 22px;
    }
    .row {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }
    input[type="text"], select {
      flex: 1 1 220px;
      min-width: 160px;
      padding: 9px 12px;
      background: var(--panel-2);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 0.95rem;
      outline: none;
    }
    input[type="text"]:focus, select:focus { border-color: var(--accent); }
    select { flex: 0 0 auto; min-width: 130px; }
    button {
      padding: 9px 18px;
      border: 1px solid var(--accent);
      background: var(--accent);
      color: #1b1b2b;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.92rem;
      font-weight: 600;
      transition: opacity 0.15s ease, transform 0.05s ease;
    }
    button:hover { opacity: 0.9; }
    button:active { transform: translateY(1px); }
    button.secondary {
      background: transparent;
      color: var(--accent);
    }
    button.secondary:hover { background: rgba(122, 162, 247, 0.12); }
    .result {
      margin-top: 6px;
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 16px;
      min-height: 56px;
      font-size: 0.92rem;
      word-break: break-all;
      white-space: pre-wrap;
    }
    .result .label { color: var(--muted); margin-right: 6px; }
    .result .val { color: var(--text); }
    .result .field { margin-bottom: 8px; }
    .result .field:last-child { margin-bottom: 0; }
    .result .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; }
    .result .err { color: var(--err); }
    .result .ok { color: var(--ok); }
    .result .steps-title { color: var(--accent-2); margin: 12px 0 8px; font-weight: 600; }
    .steps-list { margin: 0; padding-left: 20px; }
    .steps-list li { margin-bottom: 6px; }
    .muted { color: var(--muted); }
    footer {
      margin-top: 28px;
      display: flex;
      justify-content: center;
    }
    .hint { color: var(--muted); font-size: 0.82rem; margin-top: 10px; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>算法演示</h1>
      <button id="btn-export" type="button">导出全部结果</button>
    </header>

    <div class="tabs" role="tablist">
      <div class="tab-head active" data-tab="hello" role="tab" tabindex="0">HelloWorld</div>
      <div class="tab-head" data-tab="hash" role="tab" tabindex="0">哈希算法</div>
      <div class="tab-head" data-tab="bubble" role="tab" tabindex="0">冒泡排序</div>
    </div>

    <!-- Tab 1: HelloWorld -->
    <div class="tab-panel active" id="panel-hello" role="tabpanel">
      <div class="panel-card">
        <div class="row">
          <button id="btn-hello" type="button">执行</button>
          <span class="hint">GET /api/helloworld — 无需输入</span>
        </div>
        <div class="result" id="result-hello"><span class="muted">点击「执行」查看结果</span></div>
      </div>
    </div>

    <!-- Tab 2: 哈希算法 -->
    <div class="tab-panel" id="panel-hash" role="tabpanel">
      <div class="panel-card">
        <div class="row">
          <input type="text" id="hash-input" placeholder="输入待哈希文本，如 abc" autocomplete="off">
          <select id="hash-algo">
            <option value="SHA-256" selected>SHA-256</option>
            <option value="MD5">MD5</option>
            <option value="SHA-512">SHA-512</option>
          </select>
          <button id="btn-hash" type="button">执行</button>
        </div>
        <div class="result" id="result-hash"><span class="muted">点击「执行」查看哈希结果</span></div>
      </div>
    </div>

    <!-- Tab 3: 冒泡排序 -->
    <div class="tab-panel" id="panel-bubble" role="tabpanel">
      <div class="panel-card">
        <div class="row">
          <input type="text" id="bubble-input" placeholder="5,3,8,1,9,2" autocomplete="off">
          <button id="btn-bubble" type="button">执行</button>
        </div>
        <div class="result" id="result-bubble"><span class="muted">点击「执行」查看排序结果</span></div>
      </div>
    </div>

    <footer>
      <button id="btn-export-2" type="button" class="secondary">导出全部结果</button>
    </footer>
  </div>
  <script src="/js/algo-demo.js"></script>
</body>
</html>
