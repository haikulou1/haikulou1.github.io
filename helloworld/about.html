<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>关于 HelloWorld</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f5f5f5; color: #333; }
        .nav { background: #2c3e50; padding: 16px 32px; display: flex; gap: 24px; }
        .nav a { color: #ecf0f1; text-decoration: none; font-size: 16px; }
        .nav a:hover { color: #3498db; }
        .nav a.active { color: #3498db; font-weight: bold; }
        .container { max-width: 800px; margin: 40px auto; padding: 0 20px; }
        .card { background: #fff; border-radius: 8px; padding: 40px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        h1 { color: #2c3e50; margin-bottom: 20px; }
        .about-content { font-size: 16px; line-height: 1.8; color: #555; margin: 16px 0; }
        .about-author { margin-top: 24px; padding-top: 16px; border-top: 1px solid #eee; color: #888; font-size: 14px; }
        .status { margin-top: 20px; padding: 12px; border-radius: 4px; font-size: 14px; }
        .status.success { background: #d4edda; color: #155724; }
        .status.error { background: #f8d7da; color: #721c24; }
        .loading { color: #6c757d; }
    </style>
</head>
<body>
    <nav class="nav">
        <a href="hello.html">首页</a>
        <a href="about.html" class="active">关于</a>
        <a href="contact.html">联系</a>
    </nav>
    <div class="container">
        <div class="card">
            <h1 id="aboutTitle">加载中...</h1>
            <div class="about-content" id="aboutContent"></div>
            <div class="about-author" id="aboutAuthor"></div>
            <div class="status loading" id="status">正在获取关于信息...</div>
        </div>
    </div>
    <script>
        var API_BASE = 'http://localhost:8080';

        function loadAbout() {
            var titleEl = document.getElementById('aboutTitle');
            var contentEl = document.getElementById('aboutContent');
            var authorEl = document.getElementById('aboutAuthor');
            var statusEl = document.getElementById('status');

            fetch(API_BASE + '/api/about')
                .then(function(response) { return response.json(); })
                .then(function(res) {
                    if (res.code === 'OK' && res.data) {
                        titleEl.textContent = res.data.title;
                        contentEl.textContent = res.data.content;
                        authorEl.textContent = '作者：' + res.data.author;
                        statusEl.className = 'status success';
                        statusEl.textContent = '获取成功';
                    } else {
                        titleEl.textContent = '关于 HelloWorld';
                        contentEl.textContent = '这是一个前后端分离的 HelloWorld 示例应用。';
                        authorEl.textContent = '作者：DTCoder';
                        statusEl.className = 'status error';
                        statusEl.textContent = '获取失败：' + (res.msg || '未知错误') + '，已降级显示默认信息';
                    }
                })
                .catch(function(err) {
                    titleEl.textContent = '关于 HelloWorld';
                    contentEl.textContent = '这是一个前后端分离的 HelloWorld 示例应用。';
                    authorEl.textContent = '作者：DTCoder';
                    statusEl.className = 'status error';
                    statusEl.textContent = '请求失败，已降级显示默认信息（' + err.message + '）';
                });
        }

        window.onload = loadAbout;
    </script>
</body>
</html>
