<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HelloWorld 首页</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f5f5f5; color: #333; }
        .nav { background: #2c3e50; padding: 16px 32px; display: flex; gap: 24px; }
        .nav a { color: #ecf0f1; text-decoration: none; font-size: 16px; }
        .nav a:hover { color: #3498db; }
        .nav a.active { color: #3498db; font-weight: bold; }
        .container { max-width: 800px; margin: 40px auto; padding: 0 20px; }
        .card { background: #fff; border-radius: 8px; padding: 40px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); text-align: center; }
        .hello-message { font-size: 32px; margin: 20px 0; color: #2c3e50; }
        .lang-badge { display: inline-block; background: #3498db; color: #fff; padding: 4px 12px; border-radius: 12px; font-size: 14px; }
        .status { margin-top: 20px; padding: 12px; border-radius: 4px; font-size: 14px; }
        .status.success { background: #d4edda; color: #155724; }
        .status.error { background: #f8d7da; color: #721c24; }
        .loading { color: #6c757d; }
        select { padding: 8px 12px; border: 1px solid #ddd; border-radius: 4px; font-size: 14px; }
    </style>
</head>
<body>
    <nav class="nav">
        <a href="hello.html" class="active">首页</a>
        <a href="about.html">关于</a>
        <a href="contact.html">联系</a>
    </nav>
    <div class="container">
        <div class="card">
            <h1>HelloWorld</h1>
            <div class="hello-message" id="helloMessage">加载中...</div>
            <span class="lang-badge" id="langBadge" style="display:none;"></span>
            <div style="margin-top: 20px;">
                <select id="langSelect" onchange="loadHello()">
                    <option value="zh_CN">简体中文</option>
                    <option value="en_US">English</option>
                </select>
            </div>
            <div class="status loading" id="status">正在获取欢迎语...</div>
        </div>
    </div>
    <script>
        // 后端 API 基础地址
        var API_BASE = 'http://localhost:8080';

        function loadHello() {
            var lang = document.getElementById('langSelect').value;
            var messageEl = document.getElementById('helloMessage');
            var badgeEl = document.getElementById('langBadge');
            var statusEl = document.getElementById('status');

            messageEl.textContent = '加载中...';
            badgeEl.style.display = 'none';
            statusEl.className = 'status loading';
            statusEl.textContent = '正在获取欢迎语...';

            fetch(API_BASE + '/api/hello?language=' + lang)
                .then(function(response) { return response.json(); })
                .then(function(res) {
                    if (res.code === 'OK' && res.data) {
                        messageEl.textContent = res.data.message;
                        badgeEl.textContent = res.data.language;
                        badgeEl.style.display = 'inline-block';
                        statusEl.className = 'status success';
                        statusEl.textContent = '获取成功';
                    } else {
                        messageEl.textContent = 'Hello, World!';
                        statusEl.className = 'status error';
                        statusEl.textContent = '获取失败：' + (res.msg || '未知错误');
                    }
                })
                .catch(function(err) {
                    messageEl.textContent = 'Hello, World!';
                    badgeEl.style.display = 'none';
                    statusEl.className = 'status error';
                    statusEl.textContent = '请求失败，已降级显示默认文案（' + err.message + '）';
                });
        }

        window.onload = loadHello;
    </script>
</body>
</html>
