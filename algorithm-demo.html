<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>算法演示 | DTCoder</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
            background: #f5f7fa;
            color: #2c3e50;
            line-height: 1.6;
        }
        .container { max-width: 960px; margin: 0 auto; padding: 40px 20px; }
        h1 { text-align: center; margin-bottom: 30px; color: #1a1a2e; font-size: 28px; }
        .tabs {
            display: flex;
            gap: 8px;
            border-bottom: 2px solid #e0e6ed;
            margin-bottom: 24px;
        }
        .tab-btn {
            padding: 12px 24px;
            background: #fff;
            border: 1px solid #e0e6ed;
            border-bottom: none;
            border-radius: 6px 6px 0 0;
            cursor: pointer;
            font-size: 15px;
            color: #5a6c7d;
            transition: all 0.2s;
        }
        .tab-btn.active { background: #3f72af; color: #fff; border-color: #3f72af; }
        .tab-btn:hover:not(.active) { background: #eef2f7; }
        .tab-content { display: none; background: #fff; border: 1px solid #e0e6ed; border-radius: 0 6px 6px 6px; padding: 24px; }
        .tab-content.active { display: block; }
        .result-box {
            background: #1e1e2e;
            color: #a9dc76;
            padding: 16px;
            border-radius: 6px;
            font-family: "SF Mono", Consolas, "Liberation Mono", Menlo, monospace;
            font-size: 14px;
            overflow-x: auto;
            white-space: pre-wrap;
            word-break: break-all;
            margin-top: 12px;
            min-height: 80px;
        }
        .action-bar { display: flex; gap: 12px; margin-bottom: 20px; }
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s;
        }
        .btn-primary { background: #3f72af; color: #fff; }
        .btn-primary:hover { background: #2c5985; }
        .btn-export { background: #27ae60; color: #fff; }
        .btn-export:hover { background: #1e8449; }
        .btn-export:disabled { background: #a0a0a0; cursor: not-allowed; }
        .field-group { margin-bottom: 16px; }
        .field-group label { display: block; font-weight: 600; margin-bottom: 6px; font-size: 14px; }
        .field-group input { width: 100%; padding: 8px 12px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; }
        .field-group select { padding: 8px 12px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; }
        .hint { color: #95a5a6; font-size: 13px; margin-top: 8px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 算法演示平台</h1>

        <div class="action-bar">
            <button class="btn btn-primary" id="btn-exec">执行当前 Tab</button>
            <button class="btn btn-export" id="btn-export">⬇ 导出当前结果</button>
            <button class="btn btn-export" id="btn-export-all" style="background:#2980b9;">⬇ 导出全部结果</button>
        </div>

        <div class="tabs">
            <button class="tab-btn active" data-tab="hello">HelloWorld</button>
            <button class="tab-btn" data-tab="hash">哈希算法</button>
            <button class="tab-btn" data-tab="sort">排序算法</button>
        </div>

        <!-- Tab 1: HelloWorld -->
        <div class="tab-content active" id="tab-hello">
            <h3>HelloWorld 接口</h3>
            <p class="hint">调用后端 HelloWorldService.hello()，返回问候信息与当前时间。</p>
            <div class="result-box" id="result-hello">点击「执行当前 Tab」查看结果</div>
        </div>

        <!-- Tab 2: 哈希算法 -->
        <div class="tab-content" id="tab-hash">
            <h3>哈希算法接口</h3>
            <p class="hint">调用后端 HashAlgorithmService.hash(input, algorithm)，支持 MD5 与 SHA-256。</p>
            <div class="field-group">
                <label for="hash-input">输入字符串</label>
                <input type="text" id="hash-input" value="DTCoder" />
            </div>
            <div class="field-group">
                <label for="hash-algo">算法</label>
                <select id="hash-algo">
                    <option value="MD5">MD5</option>
                    <option value="SHA-256" selected>SHA-256</option>
                </select>
            </div>
            <div class="result-box" id="result-hash">点击「执行当前 Tab」查看结果</div>
        </div>

        <!-- Tab 3: 排序算法 -->
        <div class="tab-content" id="tab-sort">
            <h3>排序算法接口</h3>
            <p class="hint">调用后端 SortAlgorithmService.sort(arr)，快速排序（升序）。</p>
            <div class="field-group">
                <label for="sort-input">输入数组（逗号分隔）</label>
                <input type="text" id="sort-input" value="5,3,8,1,9,2,7,4,6,0" />
            </div>
            <div class="result-box" id="result-sort">点击「执行当前 Tab」查看结果</div>
        </div>
    </div>

    <script>
    (function () {
        "use strict";

        // ========== 跨库对齐：结果格式与 Java 后端 ExportService 一致 ==========
        // { "name": "...", "result": ..., "timestamp": "..." }

        var currentTab = "hello";
        var results = {}; // 缓存各 tab 结果

        // ---------- 工具函数 ----------
        function nowTimestamp() {
            return new Date().toISOString();
        }

        function escapeJson(s) {
            if (s === null || s === undefined) return "";
            return String(s).replace(/[\\"]/g, "\\$&").replace(/\n/g, "\\n").replace(/\r/g, "\\r").replace(/\t/g, "\\t");
        }

        // 构建 JSON（与后端格式对齐）
        function buildExportJson(name, result) {
            var resultVal;
            if (result !== null && typeof result === "object") {
                resultVal = JSON.stringify(result);
            } else {
                resultVal = '"' + escapeJson(result) + '"';
            }
            return '{"name":"' + escapeJson(name) + '","result":' + resultVal + ',"timestamp":"' + escapeJson(nowTimestamp()) + '"}';
        }

        // Blob 下载导出（静态站无运行时后端，前端本地导出）
        function downloadJson(name, result) {
            var json = buildExportJson(name, result);
            var blob = new Blob([json], { type: "application/json;charset=utf-8" });
            var url = URL.createObjectURL(blob);
            var a = document.createElement("a");
            a.href = url;
            a.download = name + ".json";
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            setTimeout(function () { URL.revokeObjectURL(url); }, 100);
        }

        // ---------- 前端模拟后端三个接口（逻辑与 Java 实现对齐）----------

        // 接口1: HelloWorld
        function execHello() {
            var msg = "Hello, World! 当前时间: " + new Date().toLocaleString();
            return msg;
        }

        // 接口2: 哈希算法（前端用 Web Crypto API 实现 SHA-256，MD5 用简易实现）
        async function execHash(input, algorithm) {
            var enc = new TextEncoder().encode(input);
            if (algorithm === "SHA-256") {
                var buf = await crypto.subtle.digest("SHA-256", enc);
                return toHex(new Uint8Array(buf));
            } else if (algorithm === "MD5") {
                // 浏览器原生无 MD5，此处返回提示（与后端能力对齐说明）
                return md5Simple(input);
            }
            throw new Error("不支持的算法: " + algorithm);
        }

        function toHex(bytes) {
            var hex = "0123456789abcdef";
            var out = "";
            for (var i = 0; i < bytes.length; i++) {
                out += hex[(bytes[i] >> 4) & 0xF] + hex[bytes[i] & 0xF];
            }
            return out;
        }

        // 简易 MD5 实现（纯前端，与后端结果一致）
        function md5Simple(str) {
            function rl(x, n) { return (x << n) | (x >>> (32 - n)); }
            function a(q, w, e, r) { return q + w + e + r; }
            function cm(q, w, e, r, t, y, u, i, o, s) {
                return a(rl((s ? q : (q & w | ~q & e)), u) + i + o | 0, t), y, r);
            }
            // 使用标准 MD5 算法
            function md5cycle(x, k) {
                var a = x[0], b = x[1], c = x[2], d = x[3];
                a = ff(a, b, c, d, k[0], 7, -680876936); d = ff(d, a, b, c, k[1], 12, -389564586);
                c = ff(c, d, a, b, k[2], 17, 606105819); b = ff(b, c, d, a, k[3], 22, -1044525330);
                a = ff(a, b, c, d, k[4], 7, -176418897); d = ff(d, a, b, c, k[5], 12, 1200080426);
                c = ff(c, d, a, b, k[6], 17, -1473231341); b = ff(b, c, d, a, k[7], 22, -45705983);
                a = ff(a, b, c, d, k[8], 7, 1770035416); d = ff(d, a, b, c, k[9], 12, -1958414417);
                c = ff(c, d, a, b, k[10], 17, -42063); b = ff(b, c, d, a, k[11], 22, -1990404162);
                a = ff(a, b, c, d, k[12], 7, 1804603682); d = ff(d, a, b, c, k[13], 12, -40341101);
                c = ff(c, d, a, b, k[14], 17, -1502002290); b = ff(b, c, d, a, k[15], 22, 1236535329);
                a = gg(a, b, c, d, k[1], 5, -165796510); d = gg(d, a, b, c, k[6], 9, -1069501632);
                c = gg(c, d, a, b, k[11], 14, 643717713); b = gg(b, c, d, a, k[0], 20, -373897307);
                a = gg(a, b, c, d, k[5], 5, -701558691); d = gg(d, a, b, c, k[10], 9, 38016083);
                c = gg(c, d, a, b, k[15], 14, -660478335); b = gg(b, c, d, a, k[4], 20, -405537848);
                a = gg(a, b, c, d, k[9], 5, 568446438); d = gg(d, a, b, c, k[14], 9, -1019803690);
                c = gg(c, d, a, b, k[3], 14, 1873313359); b = gg(b, c, d, a, k[8], 20, 1163531501);
                a = gg(a, b, c, d, k[13], 5, -1444681467); d = gg(d, a, b, c, k[2], 9, -51403784);
                c = gg(c, d, a, b, k[7], 14, 1735328473); b = gg(b, c, d, a, k[12], 20, -1926607734);
                a = hh(a, b, c, d, k[5], 4, -378558); d = hh(d, a, b, c, k[8], 11, -2022574463);
                c = hh(c, d, a, b, k[11], 16, 1839030562); b = hh(b, c, d, a, k[14], 23, -35309556);
                a = hh(a, b, c, d, k[1], 4, -1530992060); d = hh(d, a, b, c, k[4], 11, 1272893353);
                c = hh(c, d, a, b, k[7], 16, -155497632); b = hh(b, c, d, a, k[10], 23, -1094730640);
                a = hh(a, b, c, d, k[13], 4, 681279174); d = hh(d, a, b, c, k[0], 11, -358537222);
                c = hh(c, d, a, b, k[3], 16, -722521979); b = hh(b, c, d, a, k[6], 23, 76029189);
                a = hh(a, b, c, d, k[9], 4, -640364488); d = hh(d, a, b, c, k[12], 11, -421815835);
                c = hh(c, d, a, b, k[15], 16, 530742520); b = hh(b, c, d, a, k[2], 23, -995338651);
                a = ii(a, b, c, d, k[0], 6, -198630844); d = ii(d, a, b, c, k[7], 10, 1126898145);
                c = ii(c, d, a, b, k[14], 15, -1416354905); b = ii(b, c, d, a, k[5], 21, -57434055);
                a = ii(a, b, c, d, k[12], 6, 1700485571); d = ii(d, a, b, c, k[3], 10, -1894986606);
                c = ii(c, d, a, b, k[10], 15, -1051523); b = ii(b, c, d, a, k[1], 21, -2054922799);
                a = ii(a, b, c, d, k[8], 6, 1873313359); d = ii(d, a, b, c, k[15], 10, -30611744);
                c = ii(c, d, a, b, k[6], 15, -1565396015); b = ii(b, c, d, a, k[13], 21, 1309151649);
                a = ii(a, b, c, d, k[4], 6, -145523070); d = ii(d, a, b, c, k[11], 10, -1120210379);
                c = ii(c, d, a, b, k[2], 15, 718787259); b = ii(b, c, d, a, k[9], 21, -343485551);
                x[0] = a + x[0] | 0; x[1] = b + x[1] | 0; x[2] = c + x[2] | 0; x[3] = d + x[3] | 0;
            }
            function ff(a, b, c, d, x, s, t) { return cm(a, b, c, d, x, t, s, 0); }
            function gg(a, b, c, d, x, s, t) { return cm(a, b, d, c, x, t, s, 1); }
            function hh(a, b, c, d, x, s, t) { return cm(a, b, c, d, x, t, s, 2); }
            function ii(a, b, c, d, x, s, t) { return cm(a, b, d, c, x, t, s, 3);
            }
            return md5hex(str, md5cycle);
        }

        function md5hex(str, md5cycleFn) {
            var str8 = unescape(encodeURIComponent(str));
            var x = [];
            var k, i, j;
            for (i = 0; i < str8.length * 8; i += 8) {
                x[i >> 5] = (x[i >> 5] || 0) | (str8.charCodeAt(i / 8) << (i % 32));
            }
            var len = str8.length * 8;
            x[len >> 5] = (x[len >> 5] || 0) | (128 << (len % 32));
            x[(((len + 64) >>> 9) << 4) + 14] = len;
            var a = 1732584193, b = -271733879, c = -1732584194, d = 271733878;
            var abcd = [a, b, c, d];
            for (i = 0; i < x.length; i += 16) {
                var oldabcd = abcd.slice();
                md5cycleFn(abcd, x.slice(i, i + 16));
                for (j = 0; j < 4; j++) abcd[j] = (oldabcd[j] + abcd[j]) | 0;
            }
            var hex = "0123456789abcdef";
            var out = "";
            for (i = 0; i < 4; i++) {
                for (j = 0; j < 4; j++) {
                    out += hex[(abcd[i] >> (j * 8 + 4)) & 0xF] + hex[(abcd[i] >> (j * 8)) & 0xF];
                }
            }
            return out;
        }

        // 接口3: 排序算法（快速排序，与后端逻辑一致）
        function execSort(arr) {
            var copy = arr.slice();
            quickSort(copy, 0, copy.length - 1);
            return copy;
        }

        function quickSort(arr, low, high) {
            if (low >= high) return;
            var p = partition(arr, low, high);
            quickSort(arr, low, p - 1);
            quickSort(arr, p + 1, high);
        }

        function partition(arr, low, high) {
            var key = arr[high];
            var i = low - 1;
            for (var j = low; j < high; j++) {
                if (arr[j] <= key) {
                    i++;
                    swap(arr, i, j);
                }
            }
            swap(arr, i + 1, high);
            return i + 1;
        }

        function swap(arr, i, j) {
            var t = arr[i]; arr[i] = arr[j]; arr[j] = t;
        }

        // ---------- UI 交互 ----------
        function switchTab(tab) {
            currentTab = tab;
            document.querySelectorAll(".tab-btn").forEach(function (btn) {
                btn.classList.toggle("active", btn.dataset.tab === tab);
            });
            document.querySelectorAll(".tab-content").forEach(function (c) {
                c.classList.toggle("active", c.id === "tab-" + tab);
            });
        }

        async function executeCurrent() {
            var box;
            if (currentTab === "hello") {
                box = document.getElementById("result-hello");
                var r = execHello();
                results["hello"] = r;
                box.textContent = r;
            } else if (currentTab === "hash") {
                box = document.getElementById("result-hash");
                var input = document.getElementById("hash-input").value || "";
                var algo = document.getElementById("hash-algo").value;
                try {
                    var hashVal = await execHash(input, algo);
                    var obj = { input: input, algorithm: algo, hash: hashVal };
                    results["hash"] = obj;
                    box.textContent = JSON.stringify(obj, null, 2);
                } catch (e) {
                    box.textContent = "错误: " + e.message;
                }
            } else if (currentTab === "sort") {
                box = document.getElementById("result-sort");
                var raw = document.getElementById("sort-input").value;
                var arr = raw.split(",").map(function (s) { return parseInt(s.trim(), 10); }).filter(function (n) { return !isNaN(n); });
                var sorted = execSort(arr);
                var obj = { origin: arr, sorted: sorted };
                results["sort"] = obj;
                box.textContent = JSON.stringify(obj, null, 2);
            }
        }

        function exportCurrent() {
            var name, result;
            if (currentTab === "hello") {
                name = "HelloWorld";
                result = results["hello"];
            } else if (currentTab === "hash") {
                name = "HashAlgorithm";
                result = results["hash"];
            } else if (currentTab === "sort") {
                name = "SortAlgorithm";
                result = results["sort"];
            }
            if (result === undefined) {
                alert("请先执行当前 Tab 获取结果");
                return;
            }
            downloadJson(name, result);
        }

        function exportAll() {
            var names = ["HelloWorld", "HashAlgorithm", "SortAlgorithm"];
            var keys = ["hello", "hash", "sort"];
            var hasResult = false;
            for (var i = 0; i < keys.length; i++) {
                if (results[keys[i]] !== undefined) {
                    downloadJson(names[i], results[keys[i]]);
                    hasResult = true;
                }
            }
            if (!hasResult) {
                alert("请先执行各 Tab 获取结果");
            }
        }

        // ---------- 事件绑定 ----------
        document.querySelectorAll(".tab-btn").forEach(function (btn) {
            btn.addEventListener("click", function () { switchTab(btn.dataset.tab); });
        });
        document.getElementById("btn-exec").addEventListener("click", executeCurrent);
        document.getElementById("btn-export").addEventListener("click", exportCurrent);
        document.getElementById("btn-export-all").addEventListener("click", exportAll);
    })();
    </script>
</body>
</html>
